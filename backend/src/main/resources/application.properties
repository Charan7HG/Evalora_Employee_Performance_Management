spring.application.name=evalora-backend
# Render (and most PaaS hosts) inject PORT. Keep 8080 for local development.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Database
# Values are read from environment variables. Never put real credentials here.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema, so Hibernate must only validate it.
# validate = fail fast on a mismatch, never create, drop or rewrite a table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false


spring.config.import=optional:file:../.env[.properties]
# No active profile is hardcoded here. Local development sets
# SPRING_PROFILES_ACTIVE=dev in the untracked .env file; production must set it
# to a non-dev value such as "prod" so the dev bootstrap and reset beans stay off.
# ---------------------------------------------------------------------------
# Flyway migrations
# The build copies database/migrations into the jar at classpath:db/migration
# (see pom.xml), so a container can run self-contained. Local development keeps
# using the reviewable files outside the jar by default. Override the location
# with a full Flyway location string, e.g.
#   MIGRATIONS_LOCATION=classpath:db/migration
#   MIGRATIONS_LOCATION=filesystem:C:/path/to/database/migrations
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=${MIGRATIONS_LOCATION:filesystem:../database/migrations}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# A wrong working directory must fail here, not later in Hibernate validation.
# Without this, Flyway only logs "Skipping filesystem location" and startup
# continues against a stale schema (the Phase 5C V4 incident).
spring.flyway.fail-on-missing-locations=true

# ---------------------------------------------------------------------------
# Email is disabled for the whole project. Nothing may be sent.
# The email implementation (logging only) arrives in a later phase.
# ---------------------------------------------------------------------------
evalora.email.enabled=false

# ---------------------------------------------------------------------------
# JWT settings.
# No fallback secret is provided on purpose: JwtService refuses to start when
# JWT_SECRET is missing or shorter than 32 bytes. Generate one locally with
#   openssl rand -hex 32
# Expiration defaults to 8 hours (28 800 000 ms).
# ---------------------------------------------------------------------------
evalora.jwt.secret=${JWT_SECRET:}
evalora.jwt.expiration-ms=${JWT_EXPIRATION:28800000}

# ---------------------------------------------------------------------------
# There is no form login and no in-memory user. Excluding this auto-config
# avoids Boot generating (and logging) a random default password at startup.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Development-only bootstrap HR account.
# Only the `dev` profile seeder reads these values. Leave both empty outside
# local development; they are never used in any other profile.
# There is no default email or password.
# ---------------------------------------------------------------------------
evalora.bootstrap.hr.email=${EVALORA_BOOTSTRAP_HR_EMAIL:}
evalora.bootstrap.hr.password=${EVALORA_BOOTSTRAP_HR_PASSWORD:}
evalora.bootstrap.hr.employee-code=${EVALORA_BOOTSTRAP_HR_EMPLOYEE_CODE:HR-001}
evalora.bootstrap.hr.full-name=${EVALORA_BOOTSTRAP_HR_FULL_NAME:HR Administrator}

# ---------------------------------------------------------------------------
# Development-only direct password reset.
# The account is fixed here, never supplied by the browser. By default it
# falls back to the bootstrap HR account so local recovery works out of the
# box. The endpoint itself exists only under the dev profile.
# ---------------------------------------------------------------------------
evalora.dev-reset.email=${EVALORA_DEV_RESET_EMAIL:${EVALORA_BOOTSTRAP_HR_EMAIL:}}

# ---------------------------------------------------------------------------
# CORS
# Comma-separated list of browser origins allowed to call the API. The default
# keeps the local Vite server working; production sets the deployed frontend
# origin. Wildcards are rejected by SecurityConfig.
# ---------------------------------------------------------------------------
evalora.cors.allowed-origins=${EVALORA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
