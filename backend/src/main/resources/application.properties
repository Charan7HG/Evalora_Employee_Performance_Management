spring.application.name=evalora-backend
# Render (and most PaaS hosts) inject PORT. Keep 8080 for local development.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Actuator health endpoint.
# Only the health endpoint is exposed. SecurityConfig permits it without a
# token so Docker and Jenkins can probe a container without credentials.
# Details stay hidden, so the response is only {"status":"UP"} and no
# component or datasource information leaks.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Database
# Values are read from environment variables. Never put real credentials here.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema, so Hibernate must only validate it.
# validate = fail fast on a mismatch, never create, drop or rewrite a table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false


spring.config.import=optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev,gmail}
# No active profile is hardcoded here. Local development sets
# SPRING_PROFILES_ACTIVE=dev in the untracked .env file; production must set it
# to a non-dev value such as "prod" so the dev bootstrap and reset beans stay off.
# ---------------------------------------------------------------------------
# Flyway migrations
# The build copies database/migrations into the jar at classpath:db/migration
# (see pom.xml), so a container can run self-contained. Local development keeps
# using the reviewable files outside the jar by default. Override the location
# with a full Flyway location string, e.g.
#   MIGRATIONS_LOCATION=classpath:db/migration
#   MIGRATIONS_LOCATION=filesystem:C:/path/to/database/migrations
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=${MIGRATIONS_LOCATION:filesystem:../database/migrations}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# A wrong working directory must fail here, not later in Hibernate validation.
# Without this, Flyway only logs "Skipping filesystem location" and startup
# continues against a stale schema (the Phase 5C V4 incident).
spring.flyway.fail-on-missing-locations=true

# ---------------------------------------------------------------------------
# Email configuration.
# Brevo transactional API settings. Set EVALORA_EMAIL_ENABLED=true to enable
# email delivery. All values are read from environment variables; never hardcode
# secrets.
# ---------------------------------------------------------------------------
evalora.email.enabled=${EVALORA_EMAIL_ENABLED:false}
evalora.frontend.base-url=${EVALORA_FRONTEND_URL:http://localhost:5173}
evalora.e2e.capture.directory=${EVALORA_E2E_CAPTURE_DIRECTORY:}
evalora.e2e.bootstrap.email=${EVALORA_E2E_HR_EMAIL:}
evalora.e2e.bootstrap.password=${EVALORA_E2E_HR_PASSWORD:}
evalora.e2e.bootstrap.employee-code=${EVALORA_E2E_HR_EMPLOYEE_CODE:}
evalora.e2e.bootstrap.full-name=${EVALORA_E2E_HR_FULL_NAME:}

# Brevo API key for transactional email delivery.
# Generate from: https://www.brevo.com/
evalora.brevo.api-key=${BREVO_API_KEY:}

# Sender address and name for all Evalora emails.
# Format: EVALORA_MAIL_FROM_ADDRESS=evalora@yourdomain.com
evalora.mail.from-address=${EVALORA_MAIL_FROM_ADDRESS:evalora@evalora.local}
evalora.mail.from-name=${EVALORA_MAIL_FROM_NAME:Evalora}

# ---------------------------------------------------------------------------
# Gmail SMTP (active only with the `gmail` profile).
# GmailEmailService uses these values; the `prod` profile keeps Brevo and the
# `e2e-capture` profile keeps the file capture provider. Credentials are read
# from environment variables only - there is no default App Password.
# Gmail requires an App Password (not the normal account password):
# https://myaccount.google.com/apppasswords
# ---------------------------------------------------------------------------
spring.mail.host=${EVALORA_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${EVALORA_SMTP_PORT:587}
spring.mail.username=${EVALORA_SMTP_USERNAME:}
spring.mail.password=${EVALORA_SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# The mail health indicator opens an SMTP connection on every probe. Docker and
# Jenkins rely on the database-backed health check, so mail must not be able to
# mark the container unhealthy when the provider is unreachable.
management.health.mail.enabled=false

# OTP pepper for HMAC-SHA256 hashing. Must be a strong, secret value.
# Required outside the `dev` profile: the application refuses to start when it
# is empty. The `dev` profile may omit it and then uses a random, per-process
# pepper that is never written to disk and is invalid after a restart.
# Set via: evalora.otp.pepper=<strong-secret>
evalora.otp.pepper=${EVALORA_OTP_PEPPER:}

# OTP request rate limiting configuration.
# Maximum OTP requests per email per 15-minute window.
evalora.otp.max-attempts=${EVALORA_OTP_MAX_ATTEMPTS:5}

# OTP resend cooldown in seconds.
evalora.otp.resend-cooldown=${EVALORA_OTP_RESEND_COOLDOWN:60}

# ---------------------------------------------------------------------------
# JWT settings.
# No fallback secret is provided on purpose: JwtService refuses to start when
# JWT_SECRET is missing or shorter than 32 bytes. Generate one locally with
#   openssl rand -hex 32
# Expiration defaults to 8 hours (28 800 000 ms).
# ---------------------------------------------------------------------------
evalora.jwt.secret=${JWT_SECRET:}
evalora.jwt.expiration-ms=${JWT_EXPIRATION:28800000}

# ---------------------------------------------------------------------------
# There is no form login and no in-memory user. Excluding this auto-config
# avoids Boot generating (and logging) a random default password at startup.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Development-only bootstrap HR account.
# Only the `dev` profile seeder reads these values. Leave both empty outside
# local development; they are never used in any other profile.
# There is no default email or password.
# ---------------------------------------------------------------------------
evalora.bootstrap.hr.email=${EVALORA_BOOTSTRAP_HR_EMAIL:}
evalora.bootstrap.hr.password=${EVALORA_BOOTSTRAP_HR_PASSWORD:}
evalora.bootstrap.hr.employee-code=${EVALORA_BOOTSTRAP_HR_EMPLOYEE_CODE:HR-001}
evalora.bootstrap.hr.full-name=${EVALORA_BOOTSTRAP_HR_FULL_NAME:HR Administrator}

# ---------------------------------------------------------------------------
# Development-only direct password reset.
# The account is fixed here, never supplied by the browser. By default it
# falls back to the bootstrap HR account so local recovery works out of the
# box. The endpoint itself exists only under the dev profile.
# ---------------------------------------------------------------------------
evalora.dev-reset.email=${EVALORA_DEV_RESET_EMAIL:${EVALORA_BOOTSTRAP_HR_EMAIL:}}

# ---------------------------------------------------------------------------
# CORS
# Comma-separated list of browser origins allowed to call the API. The default
# keeps the local Vite server working; production sets the deployed frontend
# origin. Wildcards are rejected by SecurityConfig.
# ---------------------------------------------------------------------------
evalora.cors.allowed-origins=${EVALORA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
