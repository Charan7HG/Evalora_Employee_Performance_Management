# Test configuration.
# Tests run against an in-memory H2 database, so they never touch the real
# PostgreSQL instance and never need local credentials.
# Flyway is disabled here because the H2 schema is created by Hibernate from
# the entity mappings (ddl-auto=create-drop). The production schema is defined
# once, by Flyway, in database/migrations.
spring.datasource.url=jdbc:h2:mem:evalora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=false

evalora.email.enabled=false
# Tests never send real activation links, but the service still requires the
# setting to exist so the context can start.
evalora.frontend.base-url=http://localhost:15173
evalora.cors.allowed-origins=http://localhost:15173

# Test-only JWT settings. This secret exists only inside the test classpath;
# it is never used by a running application and is not a production secret.
evalora.jwt.secret=evalora-test-only-secret-0123456789abcdef0123456789abcdef
evalora.jwt.expiration-ms=28800000

# Test-only OTP pepper. Like the JWT secret above, this value exists only on
# the test classpath and is never used by a running application.
evalora.otp.pepper=evalora-test-only-otp-pepper-0123456789abcdef

# No in-memory user, no generated password logged at startup.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
