# =============================================================================
# Evalora frontend - Nginx site configuration
#
# Intended to be copied into the nginx:alpine image at:
#   /etc/nginx/conf.d/default.conf
#
# This file contains a server block only. The official nginx image already
# provides the surrounding http { } context and loads conf.d/*.conf.
# =============================================================================

server {
    # Container port. Docker Compose maps host 5173 to this port.
    listen 80;
    server_name _;

    # React/Vite production build copied here by frontend/Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # API reverse proxy
    #
    # proxy_pass has no URI part, so the original request URI (including the
    # /api/ prefix) is forwarded unchanged to the backend.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080;

        # HTTP/1.1 with an empty Connection header enables keep-alive to the
        # upstream without forwarding the client's hop-by-hop Connection header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve the original host and client/protocol information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # SPA routing
    #
    # Serve a matching file or directory when it exists. Otherwise return
    # index.html so React Router (BrowserRouter) can handle the route on the
    # client, making direct navigation and page refreshes work.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
